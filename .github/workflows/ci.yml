name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci

      - name: Unit tests and the real password-store round trip (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          KEYPROMPT_STORE_TEST: '1'
        run: npm test

      - name: Install a Secret Service for the Linux round trip
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      - name: Unit tests and the real password-store round trip (Linux)
        if: runner.os == 'Linux'
        env:
          KEYPROMPT_STORE_TEST: '1'
        run: |
          dbus-run-session -- sh -c '
            echo "ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            npm test
          '
